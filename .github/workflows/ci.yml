name: Quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --extra dev --managed-python
      - run: npm ci --prefix frontend
      - name: Lint, format, tests and build
        shell: pwsh
        run: ./scripts/check.ps1
      - name: Install Chromium and OS libraries
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: PostgreSQL and browser E2E
        shell: pwsh
        run: ./scripts/e2e.ps1
      - name: Check reports and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports
          path: |
            .runtime/check-report.json
            .runtime/e2e-report.json
            .runtime/recovery-report.json
            .runtime/playwright-report
            .runtime/playwright-results
          if-no-files-found: ignore
          retention-days: 7
